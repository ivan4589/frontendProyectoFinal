name: Financial Scope UI

on:
  push:
    branches:
      - agent/roles-permisos-alcance-datos
    paths:
      - '.github/workflows/financial-scope-ui.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roles-permisos-alcance-datos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final dashboard scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/features/dashboard/DashboardPage.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f'No se encontró el bloque esperado: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              """  const paymentsQuery = useQuery({
    queryKey: ['dashboard', 'payments', filters],
    queryFn: () => getPaymentMethods(filters),
  });""",
              """  const paymentsQuery = useQuery({
    queryKey: ['dashboard', 'payments', filters],
    queryFn: () => getPaymentMethods(filters),
    enabled: isAdmin,
  });""",
          )
          replace_once(
              """  const debtAlertsQuery = useQuery({
    queryKey: ['dashboard', 'debt-alerts'],
    queryFn: () => getDebtAlerts({}),
  });""",
              """  const debtAlertsQuery = useQuery({
    queryKey: ['dashboard', 'debt-alerts'],
    queryFn: () => getDebtAlerts({}),
    enabled: isAdmin,
  });""",
          )
          replace_once(
              """            <KpiCard
              title=\"Cobrado hoy\"
              value={formatCurrency(kpi?.collectionToday)}
              subtitle={`Periodo de pagos: ${periodDays} días`}
              icon={<AccountBalanceWallet />}
              color=\"#1976d2\"
            />
            <KpiCard
              title=\"Cuentas por cobrar\"
              value={formatCurrency(kpi?.totalDebt)}
              subtitle={`${kpi?.overdueAccounts ?? 0} cuentas vencidas`}
              icon={<AttachMoney />}
              color=\"#ed6c02\"
            />""",
              """            {isAdmin && (
              <KpiCard
                title=\"Cobrado hoy\"
                value={formatCurrency(kpi?.collectionToday)}
                subtitle={`Periodo de pagos: ${periodDays} días`}
                icon={<AccountBalanceWallet />}
                color=\"#1976d2\"
              />
            )}
            {isAdmin && (
              <KpiCard
                title=\"Cuentas por cobrar\"
                value={formatCurrency(kpi?.totalDebt)}
                subtitle={`${kpi?.overdueAccounts ?? 0} cuentas vencidas`}
                icon={<AttachMoney />}
                color=\"#ed6c02\"
              />
            )}""",
          )
          replace_once(
              """            lg: canSeeSales ? 'minmax(0, 2fr) minmax(320px, 1fr)' : '1fr',""",
              """            lg: isAdmin ? 'minmax(0, 2fr) minmax(320px, 1fr)' : '1fr',""",
          )
          replace_once(
              """        <Section
          title=\"Cobros por método\"""",
              """        {isAdmin && (
          <Section
            title=\"Cobros por método\"""",
          )
          replace_once(
              """        </Section>
      </Box>

      <Box
        sx={{
          display: 'grid',
          gridTemplateColumns: { xs: '1fr', lg: 'repeat(2, minmax(0, 1fr))' },""",
              """          </Section>
        )}
      </Box>

      <Box
        sx={{
          display: 'grid',
          gridTemplateColumns: { xs: '1fr', lg: 'repeat(2, minmax(0, 1fr))' },""",
          )
          replace_once(
              """        <Section
          title=\"Alertas de cobranza\"""",
              """        {isAdmin && (
          <Section
            title=\"Alertas de cobranza\"""",
          )
          replace_once(
              """        </Section>

        <Section
          title=\"Alertas de stock Central\"""",
              """          </Section>
        )}

        <Section
          title=\"Alertas de stock Central\"""",
          )
          replace_once(
              """                  <TableCell>Estado de pago</TableCell>
                  <TableCell align=\"right\">Total</TableCell>
                  <TableCell align=\"right\">Saldo</TableCell>""",
              """                  {isAdmin && <TableCell>Estado de pago</TableCell>}
                  <TableCell align=\"right\">Total</TableCell>
                  {isAdmin && <TableCell align=\"right\">Saldo</TableCell>}""",
          )
          replace_once(
              """                    <TableCell>
                      <Chip
                        size=\"small\"
                        label={
                          paymentStatusLabels[sale.paymentStatus] ??
                          sale.paymentStatus
                        }
                        color={
                          sale.paymentStatus === 'PAID'
                            ? 'success'
                            : sale.paymentStatus === 'PARTIALLY_PAID'
                              ? 'warning'
                              : 'default'
                        }
                      />
                    </TableCell>""",
              """                    {isAdmin && (
                      <TableCell>
                        <Chip
                          size=\"small\"
                          label={
                            paymentStatusLabels[sale.paymentStatus] ??
                            sale.paymentStatus
                          }
                          color={
                            sale.paymentStatus === 'PAID'
                              ? 'success'
                              : sale.paymentStatus === 'PARTIALLY_PAID'
                                ? 'warning'
                                : 'default'
                          }
                        />
                      </TableCell>
                    )}""",
          )
          replace_once(
              """                    <TableCell align=\"right\">
                      {formatCurrency(sale.balance)}
                    </TableCell>""",
              """                    {isAdmin && (
                      <TableCell align=\"right\">
                        {formatCurrency(sale.balance)}
                      </TableCell>
                    )}""",
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install and build
        id: build
        continue-on-error: true
        run: |
          npm ci
          npm run build
      - name: Record and commit
        shell: bash
        run: |
          {
            echo "RBAC_UI_FINAL_BUILD_OUTCOME=${{ steps.build.outcome }}"
            echo "Validated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/rbac-ui-final-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/dashboard/DashboardPage.tsx .github/rbac-ui-final-validation.txt
          git commit -m "Restringe métricas financieras del dashboard"
          git push origin HEAD:agent/roles-permisos-alcance-datos
          test "${{ steps.build.outcome }}" = "success"
