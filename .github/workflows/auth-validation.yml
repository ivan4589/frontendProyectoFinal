name: Frontend validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.env.example'
      - 'docs/production.md'
      - '.github/workflows/auth-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:production
      - run: npm test
      - run: npm run build
      - name: Reject public sensitive document links
        run: |
          if grep -R -nE "window\.open\(|/uploads/(reports|sales|purchases)" src; then
            echo "Sensitive document links must use authenticated Blob downloads."
            exit 1
          fi
      - run: npm audit --audit-level=high
