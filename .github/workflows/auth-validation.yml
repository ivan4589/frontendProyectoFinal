name: Frontend validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/auth-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install patched React Router release
        run: npm install react-router-dom@8.3.0 --save-exact
      - run: npm audit fix
      - run: npm run build
      - name: Reject public sensitive document links
        run: |
          if grep -R -nE "window\.open\(|/uploads/(reports|sales|purchases)" src; then
            echo "Sensitive document links must use authenticated Blob downloads."
            exit 1
          fi
      - run: npm audit --audit-level=high
      - name: Commit dependency corrections
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Actualiza React Router y dependencias vulnerables"
          git push origin HEAD:${{ github.head_ref }}
