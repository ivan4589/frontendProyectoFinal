name: Frontend authentication validation

on:
  pull_request:
    paths:
      - 'src/api/**'
      - 'src/features/auth/**'
      - 'src/routes/**'
      - 'src/components/layout/**'
      - 'src/types/auth.types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-validation.yml'
  push:
    branches:
      - agent/cierre-autenticacion-segura

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
