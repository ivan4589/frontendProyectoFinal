name: Phase 2 frontend implementation

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/phase2-pr-implementation.yml'
      - 'scripts/phase2/**'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seguridad-integridad-economica-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply economic-security interface
        run: |
          python3 scripts/phase2/frontend_operations.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev || true
      - name: Commit implementation and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Completa la interfaz de integridad económica"
          fi
          git rm -f \
            .github/workflows/phase2-pr-implementation.yml \
            scripts/phase2/frontend_operations.py
          git commit -m "Retira utilidades temporales de la fase 2"
          git push origin HEAD:agent/seguridad-integridad-economica-v1
