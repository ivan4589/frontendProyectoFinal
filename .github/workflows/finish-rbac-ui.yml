name: Finish RBAC UI

on:
  push:
    branches:
      - agent/roles-permisos-alcance-datos
    paths:
      - '.github/workflows/finish-rbac-ui.yml'

permissions:
  contents: write

jobs:
  finish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roles-permisos-alcance-datos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final permission UI rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'No se encontró el bloque esperado en {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/components/layout/MainLayout.tsx',
              "import {\n  AppBar,",
              "import type { ReactNode } from 'react';\nimport {\n  AppBar,",
          )
          replace_once(
              'src/components/layout/MainLayout.tsx',
              '  icon: React.ReactNode;',
              '  icon: ReactNode;',
          )

          replace_once(
              'src/features/clients/ClientsPage.tsx',
              "import { LocationsDialog } from './LocationsDialog';",
              "import { LocationsDialog } from './LocationsDialog';\nimport { useAuth } from '../auth/AuthContext';\nimport { hasPermission, PERMISSIONS } from '../auth/permissions';",
          )
          replace_once(
              'src/features/clients/ClientsPage.tsx',
              "export function ClientsPage() {\n  const queryClient = useQueryClient();",
              "export function ClientsPage() {\n  const queryClient = useQueryClient();\n  const { user } = useAuth();\n  const canCreateClient = hasPermission(user?.role, PERMISSIONS.CLIENTS_CREATE);\n  const canUpdateClient = hasPermission(user?.role, PERMISSIONS.CLIENTS_UPDATE);\n  const canDeleteClient = hasPermission(user?.role, PERMISSIONS.CLIENTS_DELETE);\n  const canManageLocations = hasPermission(user?.role, PERMISSIONS.CATALOG_MANAGE);",
          )
          replace_once(
              'src/features/clients/ClientsPage.tsx',
              "            <Button\n              variant=\"outlined\"\n              startIcon={<ManageSearchIcon />}\n              onClick={() => setLocationsDialogOpen(true)}\n              sx={{ fontWeight: 800, textTransform: 'none' }}\n            >\n              Localidades\n            </Button>",
              "            {canManageLocations && (\n              <Button\n                variant=\"outlined\"\n                startIcon={<ManageSearchIcon />}\n                onClick={() => setLocationsDialogOpen(true)}\n                sx={{ fontWeight: 800, textTransform: 'none' }}\n              >\n                Localidades\n              </Button>\n            )}",
          )
          replace_once(
              'src/features/clients/ClientsPage.tsx',
              "            <Button\n              variant=\"contained\"\n              startIcon={<AddIcon />}\n              onClick={handleCreateClient}\n              sx={{\n                backgroundColor: '#005b3f',\n                fontWeight: 800,\n                textTransform: 'none',\n                '&:hover': {\n                  backgroundColor: '#00432f',\n                },\n              }}\n            >\n              Nuevo cliente\n            </Button>",
              "            {canCreateClient && (\n              <Button\n                variant=\"contained\"\n                startIcon={<AddIcon />}\n                onClick={handleCreateClient}\n                sx={{\n                  backgroundColor: '#005b3f',\n                  fontWeight: 800,\n                  textTransform: 'none',\n                  '&:hover': {\n                    backgroundColor: '#00432f',\n                  },\n                }}\n              >\n                Nuevo cliente\n              </Button>\n            )}",
          )
          replace_once(
              'src/features/clients/ClientsPage.tsx',
              "                      <Tooltip title=\"Editar\">\n                        <IconButton size=\"small\" onClick={() => handleEditClient(client)}>\n                          <EditIcon fontSize=\"small\" />\n                        </IconButton>\n                      </Tooltip>\n\n                      <Tooltip title=\"Eliminar\">\n                        <IconButton\n                          size=\"small\"\n                          color=\"error\"\n                          disabled={deleteClientMutation.isPending}\n                          onClick={() => handleDeleteClient(client)}\n                        >\n                          <DeleteIcon fontSize=\"small\" />\n                        </IconButton>\n                      </Tooltip>",
              "                      {canUpdateClient && (\n                        <Tooltip title=\"Editar\">\n                          <IconButton size=\"small\" onClick={() => handleEditClient(client)}>\n                            <EditIcon fontSize=\"small\" />\n                          </IconButton>\n                        </Tooltip>\n                      )}\n\n                      {canDeleteClient && (\n                        <Tooltip title=\"Eliminar\">\n                          <IconButton\n                            size=\"small\"\n                            color=\"error\"\n                            disabled={deleteClientMutation.isPending}\n                            onClick={() => handleDeleteClient(client)}\n                          >\n                            <DeleteIcon fontSize=\"small\" />\n                          </IconButton>\n                        </Tooltip>\n                      )}",
          )

          replace_once(
              'src/features/sales/SalesPage.tsx',
              "import { useAuth } from '../auth/AuthContext';",
              "import { useAuth } from '../auth/AuthContext';\nimport { hasPermission, PERMISSIONS } from '../auth/permissions';",
          )
          replace_once(
              'src/features/sales/SalesPage.tsx',
              "  const { user } = useAuth();\n\n  const canManageSales =\n    user?.role === 'ADMIN' ||\n    user?.role === 'VENDEDOR';\n\n  const isAdmin =\n    user?.role === 'ADMIN';",
              "  const { user } = useAuth();\n  const isAdmin = user?.role === 'ADMIN';\n  const canCreateSale = hasPermission(user?.role, PERMISSIONS.SALES_CREATE);\n  const canCancelSale = hasPermission(user?.role, PERMISSIONS.SALES_CANCEL);\n  const canDownloadAllSales = hasPermission(\n    user?.role,\n    PERMISSIONS.SALES_DOWNLOAD_ALL,\n  );\n  const canManageOwnSale = (sale: Sale) =>\n    isAdmin ||\n    (user?.role === 'VENDEDOR' && sale.userId === user?.id);",
          )
          replace_once(
              'src/features/sales/SalesPage.tsx',
              '{canManageSales && (\n              <Button',
              '{canCreateSale && (\n              <Button',
          )
          sales = Path('src/features/sales/SalesPage.tsx')
          sales_text = sales.read_text(encoding='utf-8')
          sales_text = sales_text.replace('canManageSales &&', 'canManageOwnSale(sale) &&')
          sales_text = sales_text.replace('isAdmin &&\n                            sale.status !==', 'canCancelSale &&\n                            sale.status !==')
          old_document = """                  const documentUrl =\n                    sale.status ===\n                      'CANCELLED' &&\n                    sale.cancelledPdfUrl\n                      ? sale.cancelledPdfUrl\n                      : sale.pdfUrl;"""
          new_document = """                  const documentUrl = canDownloadAllSales\n                    ? sale.status === 'CANCELLED' && sale.cancelledPdfUrl\n                      ? sale.cancelledPdfUrl\n                      : sale.pdfUrl\n                    : undefined;"""
          if old_document not in sales_text:
              raise SystemExit('No se encontró el bloque documentUrl en SalesPage.tsx')
          sales.write_text(sales_text.replace(old_document, new_document, 1), encoding='utf-8')

          replace_once(
              'src/features/collections/CollectionsPage.tsx',
              "import { useAuth } from '../auth/AuthContext';",
              "import { useAuth } from '../auth/AuthContext';\nimport { hasPermission, PERMISSIONS } from '../auth/permissions';",
          )
          replace_once(
              'src/features/collections/CollectionsPage.tsx',
              "  const isAdmin = user?.role === 'ADMIN';",
              "  const isAdmin = user?.role === 'ADMIN';\n  const canRegisterPayment = hasPermission(\n    user?.role,\n    PERMISSIONS.PAYMENTS_CREATE_ASSIGNED,\n  );\n  const canDownloadOwnCollectionReport =\n    user?.role === 'COBRADOR' &&\n    hasPermission(user?.role, PERMISSIONS.REPORTS_COLLECTIONS_ASSIGNED);",
          )
          replace_once(
              'src/features/collections/CollectionsPage.tsx',
              '{!isAdmin && user?.id && (',
              '{canDownloadOwnCollectionReport && user?.id && (',
          )
          replace_once(
              'src/features/collections/CollectionsPage.tsx',
              "                        const canCollect =\n                          isAdmin ||\n                          sale.assignment\n                            ?.assignedToId === user?.id;",
              "                        const canCollect =\n                          canRegisterPayment &&\n                          (isAdmin ||\n                            sale.assignment?.assignedToId === user?.id);",
          )
          replace_once(
              'src/features/collections/CollectionsPage.tsx',
              "                            <TableCell align=\"right\">\n                              <Button\n                                variant=\"contained\"\n                                size=\"small\"\n                                startIcon={\n                                  <PaymentsIcon />\n                                }\n                                disabled={!canCollect}\n                                onClick={() =>\n                                  openPaymentDialog(\n                                    client,\n                                    sale,\n                                  )\n                                }\n                              >\n                                Registrar pago\n                              </Button>\n                            </TableCell>",
              "                            <TableCell align=\"right\">\n                              {canCollect && (\n                                <Button\n                                  variant=\"contained\"\n                                  size=\"small\"\n                                  startIcon={<PaymentsIcon />}\n                                  onClick={() =>\n                                    openPaymentDialog(client, sale)\n                                  }\n                                >\n                                  Registrar pago\n                                </Button>\n                              )}\n                            </TableCell>",
          )
          PY
      - name: Install and build
        id: build
        continue-on-error: true
        run: |
          npm ci
          npm run build
      - name: Record and commit result
        shell: bash
        run: |
          mkdir -p .github
          {
            echo "RBAC_UI_BUILD_OUTCOME=${{ steps.build.outcome }}"
            echo "Validated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/rbac-ui-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/rbac-ui-validation.txt
          git commit -m "Completa controles de permisos en la interfaz"
          git push origin HEAD:agent/roles-permisos-alcance-datos
          test "${{ steps.build.outcome }}" = "success"
