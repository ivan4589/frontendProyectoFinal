name: Phase 3 frontend implementation

on:
  pull_request:
    paths:
      - '.github/workflows/phase3-frontend-implementation.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply frontend Phase 3
        run: |
          python <<'PY'
          from pathlib import Path

          def write(path: str, content: str):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'No se encontró el bloque esperado en {path}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          write('src/api/documents.api.ts', '''import { api } from './axios';

function normalizeProtectedPath(value: string): string {
  const raw = value.startsWith('http://') || value.startsWith('https://')
    ? `${new URL(value).pathname}${new URL(value).search}`
    : value;

  if (raw.startsWith('/api/')) return raw.slice(4);
  if (raw === '/api') return '/';
  return raw.startsWith('/') ? raw : `/${raw}`;
}

function filenameFromDisposition(
  disposition: string | undefined,
  fallback: string,
): string {
  if (!disposition) return fallback;

  const utf8 = disposition.match(/filename\*=UTF-8''([^;]+)/i)?.[1];
  if (utf8) return decodeURIComponent(utf8.replace(/["']/g, ''));

  const regular = disposition.match(/filename="?([^";]+)"?/i)?.[1];
  return regular?.trim() || fallback;
}

export async function downloadProtectedDocument(
  documentUrl: string,
  fallbackFilename: string,
): Promise<void> {
  const response = await api.get<Blob>(normalizeProtectedPath(documentUrl), {
    responseType: 'blob',
    headers: { Accept: 'application/pdf,application/octet-stream' },
  });

  const blobUrl = URL.createObjectURL(response.data);
  const anchor = document.createElement('a');
  anchor.href = blobUrl;
  anchor.download = filenameFromDisposition(
    response.headers['content-disposition'],
    fallbackFilename,
  );
  anchor.rel = 'noopener';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1_000);
}
''')

